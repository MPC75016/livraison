<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bleu:#0b3d6e;--bleu2:#1f6fb2;--fond:#f3f6fa;--bord:#d5deea;--txt:#1c2733;--ok:#1d8a4e;--warn:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fond);color:var(--txt)}
  header{background:var(--bleu);color:#fff;padding:18px 16px;text-align:center}
  header p{margin:4px 0 0;font-size:15px;font-weight:600;letter-spacing:.3px}
  main{max-width:640px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--bleu)}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bord);border-radius:8px;font-size:16px;background:#fff;color:var(--txt)}
  textarea{min-height:80px;resize:vertical;font-family:inherit}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .art{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .art input.nom{flex:3}.art input.qte{flex:1.3}
  .art button{flex:0 0 40px;height:44px;border:none;border-radius:8px;background:#fdecea;color:var(--warn);font-size:20px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
  .btn-sec{background:#e7eff8;color:var(--bleu)}
  .btn-main{background:var(--bleu2);color:#fff;margin-top:6px}
  .btn-main:disabled{opacity:.6}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .chip{padding:7px 12px;border-radius:20px;background:#e7eff8;color:var(--bleu);font-size:13px;border:none}
  .choix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .choix label,.etat label{margin:0;padding:13px 8px;border:1px solid var(--bord);border-radius:10px;text-align:center;font-weight:600;font-size:14px;cursor:pointer}
  .choix input,.etat input{display:none}
  .choix label:has(input:checked),.etat label:has(input:checked){background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .etat{display:flex;gap:8px}.etat label{flex:1}
  #prestation{font-weight:600;color:var(--bleu);padding:13px 12px}
  #sig{width:100%;height:180px;border:2px dashed var(--bord);border-radius:8px;background:#fff;touch-action:none}
  .small{font-size:12px;color:#667}
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .photos img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--bord)}
  #msg{display:none;padding:14px;border-radius:10px;margin-top:12px;font-weight:600;text-align:center}
  #msg.ok{display:block;background:#e6f5ec;color:var(--ok)}
  #msg.err{display:block;background:#fdecea;color:var(--warn)}
  .actions-after{display:none;gap:8px;margin-top:10px}
  .actions-after .btn{flex:1}
</style>
</head>

<main>
  <div class="card">
    <h2>Prestation</h2>
    <select id="prestation"><option value="">— Choisir la prestation —</option></select>
    <div id="blocAutre" style="display:none"><label for="autreLib">Nom de la prestation</label><input id="autreLib" placeholder="Ex : Désinfection, nettoyage de hotte seule…"></div>
  </div>

  <div class="card">
    <h2>Client</h2>
    <label for="dest">Restaurant / site</label>
    <input id="dest" list="restos" placeholder="Choisir ou taper un client" autocomplete="off">
    <datalist id="restos"></datalist>
    <label for="adr">Adresse</label>
    <input id="adr" placeholder="Adresse d'intervention">
    <label for="date">Date</label><input id="date" type="date">
    <div class="row">
      <div><label for="hdebut">Heure de début</label><input id="hdebut" type="time"></div>
      <div><label for="hfin">Heure de fin</label><input id="hfin" type="time"></div>
    </div>
    <label for="livreur">Réalisé par</label>
    <input id="livreur" placeholder="Nom(s) de l'équipe MADY PROCLEAN">
    <label for="mailclient">E-mail du client (facultatif)</label>
    <input id="mailclient" type="email" inputmode="email" placeholder="Pour lui envoyer le rapport PDF">
  </div>

  <div class="card">
    <h2 id="titreDetail">Articles livrés</h2>
    <div class="chips" id="chips"></div>
    <div id="articles"></div>
    <button class="btn btn-sec" type="button" onclick="ajouterArticle()" id="btnAjout">+ Ajouter une ligne</button>
  </div>

  <div class="card">
    <h2>Photos</h2>
    <label id="lblAvant">Avant (facultatif)</label>
    <input id="photosAvant" type="file" accept="image/*" multiple>
    <div class="photos" id="apercuAvant"></div>
    <label id="lblApres">Après (facultatif)</label>
    <input id="photosApres" type="file" accept="image/*" multiple>
    <div class="photos" id="apercuApres"></div>
  </div>

  <div class="card">
    <h2>Fin de prestation</h2>
    <label>État</label>
    <div class="etat">
      <label><input type="radio" name="etat" value="Conforme" checked><span>Conforme</span></label>
      <label><input type="radio" name="etat" value="Avec réserves"><span>Avec réserves</span></label>
    </div>
    <label for="infos">Observations / réserves</label>
    <textarea id="infos" placeholder="Ex : RAS, ou détail des réserves du client…"></textarea>
  </div>

  <div class="card">
    <h2>Bonne réception – signature du client</h2>
    <label for="recep">Nom de la personne qui réceptionne</label>
    <input id="recep" placeholder="Nom et prénom">
    <label>Signature</label>
    <canvas id="sig"></canvas>
    <p class="small">Faites signer avec le doigt dans le cadre. <a href="#" onclick="effacerSig();return false">Effacer</a></p>
  </div>

  <button class="btn btn-main" id="envoyer" type="button" onclick="valider()">Valider et envoyer le bon</button>
  <div id="msg"></div>
  <div class="actions-after" id="after">
    <button class="btn btn-sec" type="button" onclick="telecharger()">Télécharger le PDF</button>
    <button class="btn btn-sec" type="button" onclick="nouveau()">Nouveau bon</button>
  </div>
  <p class="small" style="text-align:center;margin:18px 0">MADY PROCLEAN – interventions@madyproclean.com</p>
</main>

function numeroBon(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `BR-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

function dateLocale(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

function choisirPrestation(p){
  prestation = p; const P = PRESTATIONS[p] || GENERIQUE;
  $("blocAutre").style.display = p==="Autre (préciser)" ? "block" : "none";
  $("titreDetail").textContent = P.titre;

  P.rapides.forEach(a => { const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent="+ "+a; b.onclick=()=>ajouterArticle(a); c.appendChild(b); });
  const lignes=[...document.querySelectorAll(".art")];
  if (!lignes.some(l=>l.querySelector(".nom").value)) { $("articles").innerHTML=""; ajouterArticle(); }
  document.querySelectorAll(".art").forEach(l=>{ l.querySelector(".nom").placeholder=P.ph; l.querySelector(".qte").placeholder=P.qph; });
  const livr = p==="Livraison" || p==="Transport";
  $("lblAvant").textContent = livr ? "Photos au chargement (facultatif)" : "Avant (facultatif)";
  $("lblApres").textContent = livr ? "Photos à la livraison (facultatif)" : "Après (facultatif)";
}

function ajouterArticle(nom="", qte=""){
  const P = PRESTATIONS[prestation] || GENERIQUE;
  const vide = [...document.querySelectorAll(".art")].find(l => !l.querySelector(".nom").value);
  if (nom && vide){ vide.querySelector(".nom").value = nom; vide.querySelector(".qte").focus(); return; }
  const d = document.createElement("div"); d.className="art";
  d.innerHTML = '<input class="nom"><input class="qte"><button type="button" aria-label="Supprimer">×</button>';
  d.querySelector(".nom").placeholder=P.ph; d.querySelector(".qte").placeholder=P.qph;
  d.querySelector(".nom").value = nom; d.querySelector(".qte").value = qte;
  d.querySelector("button").onclick = () => { d.remove(); if(!document.querySelector(".art")) ajouterArticle(); };
  $("articles").appendChild(d);
  if (nom) d.querySelector(".qte").focus();
}

function lireArticles(){
  return [...document.querySelectorAll(".art")]
    .map(l => ({nom:l.querySelector(".nom").value.trim(), qte:l.querySelector(".qte").value.trim()}))
    .filter(a => a.nom);
}

function brancherPhotos(inputId, apercuId, liste){
  $(inputId).addEventListener("change", async e => {
    for (const f of e.target.files){
      const url = await compresser(f, 1000, 0.6);
      liste().push(url);
      const im = document.createElement("img"); im.src = url; $(apercuId).appendChild(im);
    }
    e.target.value = "";
  });
}
function compresser(file, max, q){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      let w=img.width,h=img.height; if (w>max||h>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

// Signature
function initSig(){
  const c=$("sig"); const ratio=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect(); c.width=r.width*ratio; c.height=r.height*ratio;
  sigCtx=c.getContext("2d"); sigCtx.scale(ratio,ratio); sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.strokeStyle="#0b1f3a";
  const pos=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  c.addEventListener("pointerdown",e=>{ dessin=true; try{c.setPointerCapture(e.pointerId)}catch(_){} const [x,y]=pos(e); sigCtx.beginPath(); sigCtx.moveTo(x,y); });
  c.addEventListener("pointermove",e=>{ if(!dessin) return; const [x,y]=pos(e); sigCtx.lineTo(x,y); sigCtx.stroke(); signe=true; });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>c.addEventListener(t,()=>dessin=false));
}
function effacerSig(){ const c=$("sig"); sigCtx.save(); sigCtx.setTransform(1,0,0,1,0,0); sigCtx.clearRect(0,0,c.width,c.height); sigCtx.restore(); signe=false; }

function message(t, ok){ const m=$("msg"); m.textContent=t; m.className = ok ? "ok" : "err"; }
function fr(d){ const [y,m,j]=d.split("-"); return `${j}/${m}/${y}`; }
function horaires(d){ return d.hdebut && d.hfin ? `${d.hdebut} – ${d.hfin}` : (d.hfin || d.hdebut || ""); }

// Génération du PDF
function genererPDF(data){
  const { jsPDF } = window.jspdf; const P = PRESTATIONS[data.prestation];
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W=210, M=18; let y;
  doc.setFillColor(11,61,110); doc.rect(0,0,W,36,"F");
  doc.addImage(LOGO,"PNG",M,3,32,30);
  doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Bon de réception", W/2, 15, {align:"center"});
  doc.setFontSize(11); doc.setFont("helvetica","normal"); doc.text(data.libelle, W/2, 23, {align:"center"});
  doc.setFontSize(10);
  doc.text("N° "+data.numero, W-M, 15, {align:"right"});
  doc.text(fr(data.date)+(horaires(data)?"  "+horaires(data):""), W-M, 22, {align:"right"});
  doc.setTextColor(28,39,51); y=48;

  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Client", M, y); doc.text("Réalisé par", 120, y);
  doc.setFont("helvetica","normal"); y+=6;
  doc.text(doc.splitTextToSize(data.destinataire, 95), M, y); doc.text(doc.splitTextToSize(data.livreur||"-", 72), 120, y);
  if (data.adresse){ const l=doc.splitTextToSize(data.adresse, 95); doc.text(l, M, y+5.5); y+=5.5*l.length; }
  y+=12;

  doc.setFillColor(231,239,248); doc.rect(M, y-5, W-2*M, 8, "F");
  doc.setFont("helvetica","bold"); doc.text(P.col, M+3, y); doc.text(P.qcol, W-M-3, y, {align:"right"});
  doc.setFont("helvetica","normal"); y+=9;
  data.articles.forEach(a=>{
    if (y>250){ doc.addPage(); y=20; }
    const l=doc.splitTextToSize(a.nom, 115); doc.text(l, M+3, y); doc.text(doc.splitTextToSize(a.qte||"-", 45), W-M-3, y, {align:"right"});
    y+=5*(l.length-1); doc.setDrawColor(213,222,234); doc.line(M, y+3, W-M, y+3); y+=9;
  });
  y+=4;

  doc.setFont("helvetica","bold"); doc.text("État : ", M, y);
  const ok = data.etat==="Conforme"; doc.setTextColor(ok?29:192, ok?138:57, ok?78:43);
  doc.text(data.etat, M+14, y); doc.setTextColor(28,39,51); y+=8;
  doc.text("Observations / réserves :", M, y); doc.setFont("helvetica","normal"); y+=6;
  const inf = doc.splitTextToSize(data.infos||"-", W-2*M); doc.text(inf, M, y); y+=5.5*inf.length+8;

  if (y>220){ doc.addPage(); y=20; }
  doc.setFont("helvetica","bold"); doc.text("Bonne réception – le client", M, y); y+=6;
  doc.setFont("helvetica","normal"); doc.text("Nom : "+data.receptionnaire, M, y); y+=4;
  doc.setDrawColor(180); doc.rect(M, y, 80, 34);
  if (data.signature) doc.addImage(data.signature, "PNG", M+2, y+2, 76, 30);
  doc.setFontSize(9); doc.text("Signature", M, y+39); doc.setFontSize(11);

  const livr = data.prestation==="Livraison" || data.prestation==="Transport";
  [[livr?"Photos au chargement":"Photos avant", data.photosAvant],[livr?"Photos à la livraison":"Photos après", data.photosApres]].forEach(([titre, liste])=>{
    if (!liste.length) return;
    doc.addPage(); y=20; doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(titre, M, y); doc.setFontSize(11); y+=6;
    let x=M;
    liste.forEach(p=>{
      const pr=doc.getImageProperties(p); const w=84, h=Math.min(84*pr.height/pr.width, 110);
      if (y+h>285){ doc.addPage(); y=20; x=M; }
      doc.addImage(p,"JPEG",x,y,w,h);
      if (x===M){ x=M+w+6; } else { x=M; y+=h+6; }
    });
  });
  return doc;
}

function blobVersBase64(blob){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result.split(",")[1]); f.readAsDataURL(blob); }); }
async function envoyer(p){
  try { const r = await fetch(MAKE_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}); return r.ok; }
  catch(e){ return false; }
}
function lireAttente(){ try { return JSON.parse(localStorage.getItem("mp_bl_attente")||"[]"); } catch(e){ return []; } }
function mettreEnAttente(p){ const l=lireAttente(); l.push(p); try { localStorage.setItem("mp_bl_attente",JSON.stringify(l)); } catch(e){} }
async function renvoyerEnAttente(){
  const l=lireAttente(); if(!l.length) return; const reste=[];
  for (const p of l){ if(!(await envoyer(p))) reste.push(p); }
  try { localStorage.setItem("mp_bl_attente",JSON.stringify(reste)); } catch(e){}
}
window.addEventListener("online", renvoyerEnAttente);
renvoyerEnAttente();

function telecharger(){
  if (!dernierPDF) return;
  const f = new File([dernierPDF], dernierNom, {type:"application/pdf"});
  if (navigator.canShare && navigator.canShare({files:[f]})) { navigator.share({files:[f], title:dernierNom}).catch(()=>{}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(dernierPDF); a.download=dernierNom; a.click();
